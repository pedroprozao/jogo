<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Zumbi House</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a0c;
    color: #eee;
    font-family: 'Courier New', monospace;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}
#hud {
    display: flex;
    gap: 20px;
    background: #1a1a1e;
    padding: 10px 20px;
    border: 2px solid #3a3a44;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 16px;
}
#hud span { color: #4af; font-weight: bold; }
#erro {
    background: #400;
    color: #f88;
    padding: 10px 20px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 14px;
    max-width: 960px;
    display: none;
    white-space: pre-wrap;
}
canvas {
    background: #1a1a1e;
    border: 3px solid #3a3a44;
    border-radius: 8px;
    display: block;
    cursor: crosshair;
}
#inventario {
    margin-top: 10px;
    background: #1a1a1e;
    padding: 10px 20px;
    border: 2px solid #3a3a44;
    border-radius: 8px;
    width: 960px;
    font-size: 13px;
}
#itens { display: flex; gap: 10px; margin-top: 6px; }
.item-slot {
    flex: 1;
    background: #2a2a33;
    border: 2px solid #444;
    border-radius: 6px;
    padding: 8px;
    text-align: center;
    font-size: 12px;
}
.item-slot.vazio { opacity: 0.3; }
.item-slot.selecionado { border-color: #4CAF50; background: #2a4a2a; }
#aviso {
    margin-top: 8px;
    color: #ffcc00;
    font-size: 12px;
    text-align: center;
    max-width: 960px;
}
#gameOver {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.97);
    padding: 40px 60px;
    border: 4px solid #c00;
    border-radius: 12px;
    text-align: center;
    z-index: 1000;
    box-shadow: 0 0 80px #c00;
}
#gameOver h1 { color: #c00; font-size: 48px; margin-bottom: 20px; }
#gameOver p { font-size: 18px; margin-bottom: 10px; }
#gameOver button {
    margin-top: 20px;
    padding: 12px 30px;
    background: #c00;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 18px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
}
.escondido { display: none !important; }
</style>
</head>
<body>

<div id="erro"></div>

<div id="hud">
    <div>❤️ Vida: <span id="vida">100</span></div>
    <div>🔫 Munição: <span id="municao">0</span></div>
    <div>🕐 Tempo: <span id="tempo">0</span>s</div>
    <div>🧟 Zumbis: <span id="zumbis">0</span></div>
    <div>🪵 Barricadas: <span id="barricadas">0</span></div>
</div>

<canvas id="canvas" width="960" height="640"></canvas>

<div id="inventario">
    <strong>🎒 Inventário (1-5)</strong>
    <div id="itens"></div>
</div>

<div id="aviso">
    WASD/Setas = andar | Shift = correr | Mouse = mirar | Clique esq = atirar |
    Clique dir = empurrar | 1-5 = usar item | E = colocar barricada | Q = devolver
</div>

<div id="gameOver" class="escondido">
    <h1>💀 VOCÊ MORREU 💀</h1>
    <p>Sobreviveu <span id="tempoFinal">0</span>s</p>
    <p>Zumbis mortos: <span id="zumbisMortos">0</span></p>
    <button onclick="location.reload()">🔁 Tentar Novamente</button>
</div>

<script>
"use strict";

// ===== TRATADOR DE ERROS (mostra na tela se algo quebrar) =====
window.onerror = function(msg, url, line) {
    const el = document.getElementById('erro');
    if (el) {
        el.style.display = 'block';
        el.textContent = '⚠️ ERRO na linha ' + line + ': ' + msg;
    }
    return false;
};

try {

// ===== POLYFILL roundRect =====
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        this.beginPath();
        this.moveTo(x + r[0], y);
        this.arcTo(x + w, y, x + w, y + h, r[1]);
        this.arcTo(x + w, y + h, x, y + h, r[2]);
        this.arcTo(x, y + h, x, y, r[3]);
        this.arcTo(x, y, x + w, y, r[0]);
        this.closePath();
        return this;
    };
}

// ===== CANVAS =====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const LARGURA = 960;
const ALTURA = 640;
const TAMANHO_TILE = 40;
const MAPA_LARGURA = 60;
const MAPA_ALTURA = 40;
const LARGURA_MUNDO = MAPA_LARGURA * TAMANHO_TILE;
const ALTURA_MUNDO = MAPA_ALTURA * TAMANHO_TILE;

// ===== ESTADO GLOBAL =====
let audioCtx = null;
let jogador, zumbis, itens, particulas;
let barricadas = [];
let manchasSangue = [];
let movelCarregado = null;
let inventario = [];
let itemSelecionado = 0;
let tempo = 0;
let rodando = true;
let spawnTimer = 0;
let ultimoFrame = 0;
let gemidoTimer = 0;
let mouse = { x: LARGURA/2, y: ALTURA/2 };
let segurandoE = false;
let botaoDireitoPressionado = false;
let camera = { x: 0, y: 0 };
let zumbisMortosContador = 0;

// ===== ÁUDIO =====
function initAudio() {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
}

function toca(freqIni, freqFim, dur, tipo, vol) {
    if (!audioCtx) return;
    try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = tipo;
        o.frequency.setValueAtTime(freqIni, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(Math.max(1, freqFim), audioCtx.currentTime + dur);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g).connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur + 0.05);
    } catch(e) {}
}

const tocarTiro = () => toca(220, 60, 0.18, 'square', 0.2);
const tocarDano = () => toca(140, 70, 0.3, 'sawtooth', 0.25);
const tocarCura = () => toca(440, 880, 0.35, 'sine', 0.18);
const tocarColeta = () => toca(600, 900, 0.12, 'triangle', 0.15);
const tocarZumbiMorto = () => toca(180, 40, 0.45, 'sawtooth', 0.2);
const tocarBarricadaQuebrada = () => toca(60, 30, 0.7, 'square', 0.28);

function tocarGemido() {
    if (!audioCtx) return;
    try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(120 + Math.random()*40, audioCtx.currentTime);
        g.gain.setValueAtTime(0, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.2);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
        o.connect(g).connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + 1.1);
    } catch(e) {}
}

function tocarArrombando() {
    toca(90 + Math.random()*40, 50, 0.1, 'square', 0.2);
}

// ===== MAPA =====
function criarMapa() {
    const m = [];
    for (let y = 0; y < MAPA_ALTURA; y++) {
        const linha = [];
        for (let x = 0; x < MAPA_LARGURA; x++) {
            if (x === 0 || y === 0 || x === MAPA_LARGURA-1 || y === MAPA_ALTURA-1) {
                linha.push(1);
            } else {
                linha.push(3);
            }
        }
        m.push(linha);
    }

    // Chão externo
    for (let y = 1; y < MAPA_ALTURA-1; y++) {
        for (let x = 1; x < MAPA_LARGURA-1; x++) {
            if (y < 22) m[y][x] = 3;
            else if (y < 26) m[y][x] = 4;
            else m[y][x] = 2;
        }
    }

    // Casa
    for (let y = 4; y < 20; y++)
        for (let x = 4; x < 39; x++) m[y][x] = 0;
    for (let y = 17; y < 20; y++)
        for (let x = 31; x < 39; x++) m[y][x] = 6;
    for (let y = 4; y < 12; y++)
        for (let x = 4; x < 21; x++) m[y][x] = 5;

    // Paredes externas
    for (let x = 3; x < 40; x++) { m[3][x] = 1; m[20][x] = 1; }
    for (let y = 3; y < 21; y++) { m[y][3] = 1; m[y][39] = 1; }

    // Porta
    m[20][20] = 0; m[20][21] = 0;

    // Parede central vertical
    for (let y = 4; y < 20; y++)
        if (y !== 10 && y !== 11) m[y][21] = 1;

    // Parede horizontal
    for (let x = 4; x < 39; x++)
        if (x !== 12 && x !== 13 && x !== 30 && x !== 31) m[12][x] = 1;

    // Quarto canto
    for (let y = 13; y < 20; y++) m[y][30] = 1;
    for (let x = 30; x < 39; x++) m[16][x] = 1;
    m[16][33] = 0;

    // Banheiro
    for (let y = 17; y < 20; y++) m[y][31] = 1;
    m[17][35] = 0;

    // Muros
    for (let y = 21; y < 25; y++) { m[y][8] = 1; m[y][55] = 1; }

    // Obstáculos
    m[28][8] = 1; m[28][9] = 1;
    m[28][25] = 1; m[28][26] = 1;
    m[28][45] = 1; m[28][46] = 1;
    m[33][12] = 1; m[33][13] = 1; m[33][14] = 1;
    m[33][40] = 1; m[33][41] = 1; m[33][42] = 1;

    return m;
}

const MAPA = criarMapa();

// ===== COLISÃO =====
function colide(x, y, raio) {
    const x1 = Math.floor((x - raio) / TAMANHO_TILE);
    const y1 = Math.floor((y - raio) / TAMANHO_TILE);
    const x2 = Math.floor((x + raio) / TAMANHO_TILE);
    const y2 = Math.floor((y + raio) / TAMANHO_TILE);

    for (let ty = y1; ty <= y2; ty++) {
        for (let tx = x1; tx <= x2; tx++) {
            if (ty < 0 || tx < 0 || ty >= MAPA_ALTURA || tx >= MAPA_LARGURA) return true;
            if (MAPA[ty][tx] === 1) return true;
        }
    }
    for (let i = 0; i < barricadas.length; i++) {
        const b = barricadas[i];
        const dx = x - b.x, dy = y - b.y;
        if (Math.sqrt(dx*dx + dy*dy) < raio + b.raio) return true;
    }
    return false;
}

function temVisao(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const passos = Math.ceil(dist / 15);
    for (let i = 1; i < passos; i++) {
        const t = i / passos;
        const tx = Math.floor((x1 + dx * t) / TAMANHO_TILE);
        const ty = Math.floor((y1 + dy * t) / TAMANHO_TILE);
        if (ty < 0 || tx < 0 || ty >= MAPA_ALTURA || tx >= MAPA_LARGURA) return false;
        if (MAPA[ty][tx] === 1) return false;
    }
    return true;
}

// ===== TIPOS DE ITEM =====
const TIPOS_ITEM = {
    'arma':       { emoji: '🔫', nome: 'Pistola',   cor: '#888', cor2: '#555' },
    'municao':    { emoji: '📦', nome: 'Munição',   cor: '#a85', cor2: '#753' },
    'medkit':     { emoji: '💊', nome: 'Medkit',    cor: '#e33', cor2: '#911' },
    'caixa':      { emoji: '📦', nome: 'Caixa',     cor: '#a86', cor2: '#753', movel: true, tamanho: 16, vida: 80 },
    'caixagrande':{ emoji: '🗃️', nome: 'Caixa G.',  cor: '#c96', cor2: '#864', movel: true, tamanho: 22, vida: 150 },
    'geladeira':  { emoji: '🧊', nome: 'Geladeira', cor: '#6cf', cor2: '#48a', movel: true, tamanho: 20, vida: 200 },
    'sofa':       { emoji: '🛋️', nome: 'Sofá',      cor: '#864', cor2: '#542', movel: true, tamanho: 20, vida: 120 },
    'estante':    { emoji: '📚', nome: 'Estante',   cor: '#654', cor2: '#432', movel: true, tamanho: 18, vida: 110 },
    'barril':     { emoji: '🛢️', nome: 'Barril',    cor: '#a44', cor2: '#722', movel: true, tamanho: 18, vida: 130 },
    'mesa':       { emoji: '🪑', nome: 'Mesa',      cor: '#975', cor2: '#643', movel: true, tamanho: 18, vida: 100 },
};

// ===== ENTIDADES =====
function criarJogador() {
    return { x: 700, y: 550, raio: 12, vel: 190, vida: 100, municao: 0, direcao: 0, passo: 0 };
}
function criarZumbiRapido(x, y) {
    return { x, y, raio: 10, vel: 130 + Math.random()*30, vida: 20, dano: 6, ultimoDano: 0,
             tipo: 'rapido', cor: '#7cff5a', corBorda: '#3a8a1a', passo: 0,
             ultimoVisto: null, tempoPerdido: 0, memoria: 3, vagarPonto: null };
}
function criarZumbiForte(x, y) {
    return { x, y, raio: 18, vel: 50 + Math.random()*15, vida: 70, dano: 15, ultimoDano: 0,
             tipo: 'forte', cor: '#3a8a3a', corBorda: '#1a4a1a', passo: 0,
             ultimoVisto: null, tempoPerdido: 0, memoria: 5, vagarPonto: null };
}
function criarItem(x, y, tipo) {
    return { x, y, tipo, raio: 10, bob: Math.random() * Math.PI * 2 };
}

// ===== INPUT =====
const teclas = {};

function onKeyDown(e) {
    initAudio();
    const k = e.key.toLowerCase();
    teclas[k] = true;

    if (e.key >= '1' && e.key <= '5') usarItem(parseInt(e.key) - 1);
    if (e.key === ' ') { e.preventDefault(); atirar(); }
    if (k === 'e') segurandoE = true;
    if (k === 'q' && movelCarregado) {
        adicionarItem(movelCarregado);
        movelCarregado = null;
        atualizarInventario();
    }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) >= 0) {
        e.preventDefault();
    }
}

function onKeyUp(e) {
    const k = e.key.toLowerCase();
    teclas[k] = false;
    if (k === 'e') segurandoE = false;
}

window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);

canvas.addEventListener('mousemove', function(e) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) * (LARGURA / rect.width);
    mouse.y = (e.clientY - rect.top) * (ALTURA / rect.height);
});

canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

canvas.addEventListener('mousedown', function(e) {
    initAudio();
    if (e.button === 0) atirar();
    if (e.button === 2) {
        botaoDireitoPressionado = true;
        tentarEmpurrarItem();
    }
});

window.addEventListener('mouseup', function(e) {
    if (e.button === 2) botaoDireitoPressionado = false;
});

// ===== INVENTÁRIO =====
function adicionarItem(tipo) {
    if (inventario.length >= 5) inventario[itemSelecionado] = tipo;
    else inventario.push(tipo);
    atualizarInventario();
    tocarColeta();
}

function usarItem(idx) {
    if (idx >= inventario.length) return;
    const tipo = inventario[idx];
    if (!tipo) return;
    itemSelecionado = idx;
    const info = TIPOS_ITEM[tipo];

    if (tipo === 'medkit') {
        if (jogador.vida >= 100) return;
        jogador.vida = Math.min(100, jogador.vida + 40);
        inventario.splice(idx, 1);
        itemSelecionado = 0;
        tocarCura();
    } else if (tipo === 'municao') {
        jogador.municao += 8;
        inventario.splice(idx, 1);
        itemSelecionado = 0;
        tocarColeta();
    } else if (info && info.movel) {
        if (movelCarregado) return;
        movelCarregado = tipo;
        inventario.splice(idx, 1);
        itemSelecionado = 0;
        tocarColeta();
    }
    atualizarInventario();
    atualizarHUD();
}

function atualizarInventario() {
    const div = document.getElementById('itens');
    div.innerHTML = '';
    for (let i = 0; i < 5; i++) {
        const slot = document.createElement('div');
        slot.className = 'item-slot';
        if (i === itemSelecionado) slot.classList.add('selecionado');
        const tipo = inventario[i];
        if (tipo) {
            const info = TIPOS_ITEM[tipo];
            slot.textContent = (i+1) + '. ' + info.emoji + ' ' + info.nome;
        } else {
            slot.classList.add('vazio');
            slot.textContent = (i+1) + '. vazio';
        }
        div.appendChild(slot);
    }
}

function atualizarHUD() {
    if (!jogador) return;
    document.getElementById('vida').textContent = Math.max(0, Math.round(jogador.vida));
    document.getElementById('municao').textContent = jogador.municao;
    document.getElementById('tempo').textContent = Math.floor(tempo);
    document.getElementById('zumbis').textContent = zumbis.length;
    document.getElementById('barricadas').textContent = barricadas.length;
}

// ===== AÇÕES =====
function atirar() {
    initAudio();
    if (!rodando) return;
    if (jogador.municao <= 0) return;
    if (inventario.indexOf('arma') < 0) return;

    jogador.municao--;
    tocarTiro();

    const dirX = Math.cos(jogador.direcao);
    const dirY = Math.sin(jogador.direcao);

    let alvo = null, menorDist = 500;
    for (let i = 0; i < zumbis.length; i++) {
        const z = zumbis[i];
        const dx = z.x - jogador.x, dy = z.y - jogador.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > menorDist) continue;
        const dot = (dx * dirX + dy * dirY) / dist;
        if (dot > 0.95) { menorDist = dist; alvo = z; }
    }

    particulas.push({
        tipo: 'tiro', x1: jogador.x, y1: jogador.y,
        x2: jogador.x + dirX * 500, y2: jogador.y + dirY * 500, vida: 0.08
    });

    if (alvo) {
        alvo.vida -= 20;
        for (let i = 0; i < 8; i++) {
            particulas.push({
                tipo: 'sangue', x: alvo.x, y: alvo.y,
                vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, vida: 0.6
            });
        }
        if (alvo.vida <= 0) {
            tocarZumbiMorto();
            adicionarSangue(alvo.x, alvo.y, alvo.raio * 0.9);
            zumbisMortosContador++;
        }
    }
    atualizarHUD();
}

function tentarEmpurrarItem() {
    if (movelCarregado) return;
    const mundoMouseX = mouse.x + camera.x;
    const mundoMouseY = mouse.y + camera.y;

    let maisProximo = null, menorDist = 70;
    for (let i = 0; i < itens.length; i++) {
        const it = itens[i];
        const info = TIPOS_ITEM[it.tipo];
        if (!info.movel) continue;
        const d = Math.sqrt((it.x - mundoMouseX)**2 + (it.y - mundoMouseY)**2);
        if (d < menorDist) { menorDist = d; maisProximo = it; }
    }
    if (!maisProximo) return;

    const dx = maisProximo.x - jogador.x;
    const dy = maisProximo.y - jogador.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > jogador.raio + maisProximo.raio + 40) return;

    const info = TIPOS_ITEM[maisProximo.tipo];
    const nx = maisProximo.x + Math.cos(jogador.direcao) * 45;
    const ny = maisProximo.y + Math.sin(jogador.direcao) * 45;

    if (!colide(nx, ny, info.tamanho)) {
        maisProximo.x = nx;
        maisProximo.y = ny;
        tocarColeta();
    }
}

function tentarColocarBarricada() {
    if (!movelCarregado) return;
    const info = TIPOS_ITEM[movelCarregado];

    const px = jogador.x + Math.cos(jogador.direcao) * (jogador.raio + info.tamanho + 4);
    const py = jogador.y + Math.sin(jogador.direcao) * (jogador.raio + info.tamanho + 4);

    if (colide(px, py, info.tamanho)) return;
    for (let i = 0; i < barricadas.length; i++) {
        const b = barricadas[i];
        if (Math.sqrt((b.x-px)**2 + (b.y-py)**2) < info.tamanho + b.raio) return;
    }

    barricadas.push({
        x: px, y: py, tipo: movelCarregado,
        raio: info.tamanho, vida: info.vida, vidaMax: info.vida
    });

    movelCarregado = null;
    tocarColeta();
    atualizarInventario();
    atualizarHUD();
}

function adicionarSangue(x, y, escala) {
    if (manchasSangue.length >= 800) manchasSangue.shift();
    const num = 4 + Math.floor(Math.random() * 4);
    for (let i = 0; i < num; i++) {
        const ang = Math.random() * Math.PI * 2;
        const dist = Math.random() * (escala * 1.3);
        manchasSangue.push({
            x: x + Math.cos(ang) * dist,
            y: y + Math.sin(ang) * dist,
            raio: 3 + Math.random() * escala * 0.8,
            cor: 'rgba(' + (120 + Math.random()*60|0) + ',' + (10 + Math.random()*20|0) + ',' + (10 + Math.random()*20|0) + ',' + (0.5 + Math.random()*0.4) + ')',
            rot: Math.random() * Math.PI * 2,
            escalaY: 0.6 + Math.random() * 0.8
        });
    }
}

// ===== INICIAR =====
function iniciar() {
    jogador = criarJogador();
    zumbis = [];
    itens = [];
    barricadas = [];
    manchasSangue = [];
    movelCarregado = null;
    particulas = [];
    inventario = [];
    tempo = 0;
    rodando = true;
    itemSelecionado = 0;
    spawnTimer = 0;
    gemidoTimer = 0;
    zumbisMortosContador = 0;

    for (let i = 0; i < 6; i++) {
        const tipo = Math.random() < 0.6 ? 'rapido' : 'forte';
        const x = 100 + Math.random() * 700;
        const y = 1000 + Math.random() * 200;
        zumbis.push(tipo === 'rapido' ? criarZumbiRapido(x, y) : criarZumbiForte(x, y));
    }

    const posicoesItens = [
        [200, 200, 'arma'], [350, 300, 'municao'], [500, 200, 'municao'],
        [300, 450, 'medkit'], [700, 200, 'geladeira'], [800, 400, 'sofa'],
        [150, 600, 'caixa'], [900, 600, 'caixagrande'], [600, 450, 'municao'],
        [450, 700, 'medkit'], [1000, 300, 'estante'], [750, 700, 'barril'],
        [1100, 200, 'geladeira'], [1200, 500, 'medkit'], [1300, 300, 'municao'],
        [1400, 700, 'arma'], [500, 800, 'mesa'], [200, 1000, 'caixa'],
        [400, 1000, 'caixagrande'], [900, 1000, 'sofa'], [1100, 1000, 'estante'],
        [1500, 300, 'barril'], [1500, 600, 'caixa'], [1600, 200, 'geladeira'],
        [1700, 500, 'sofa'], [1800, 300, 'municao'], [1900, 700, 'medkit'],
        [2000, 400, 'estante'], [2100, 200, 'caixagrande'], [700, 900, 'barril'],
    ];

    for (let i = 0; i < posicoesItens.length; i++) {
        const p = posicoesItens[i];
        if (!colide(p[0], p[1], 15)) itens.push(criarItem(p[0], p[1], p[2]));
    }

    atualizarHUD();
    atualizarInventario();
    requestAnimationFrame(loop);
}

// ===== UPDATE =====
function atualizar(dt) {
    if (!rodando) return;
    tempo += dt;
    spawnTimer += dt;
    gemidoTimer += dt;

    if (gemidoTimer > 1.5 && zumbis.length > 0) {
        gemidoTimer = 0;
        tocarGemido();
    }

    const mmX = mouse.x + camera.x;
    const mmY = mouse.y + camera.y;
    jogador.direcao = Math.atan2(mmY - jogador.y, mmX - jogador.x);

    let dx = 0, dy = 0;
    if (teclas['w'] || teclas['arrowup']) dy -= 1;
    if (teclas['s'] || teclas['arrowdown']) dy += 1;
    if (teclas['a'] || teclas['arrowleft']) dx -= 1;
    if (teclas['d'] || teclas['arrowright']) dx += 1;

    if (dx !== 0 || dy !== 0) {
        const len = Math.sqrt(dx*dx + dy*dy);
        dx /= len; dy /= len;
        const correr = (teclas['shift']) ? 1.55 : 1;
        const nx = jogador.x + dx * jogador.vel * correr * dt;
        const ny = jogador.y + dy * jogador.vel * correr * dt;
        if (!colide(nx, jogador.y, jogador.raio)) jogador.x = nx;
        if (!colide(jogador.x, ny, jogador.raio)) jogador.y = ny;
        jogador.passo += dt * 10;
    }

    if (segurandoE && movelCarregado) {
        if (!jogador.ultimaColocacao || tempo - jogador.ultimaColocacao > 0.3) {
            tentarColocarBarricada();
            jogador.ultimaColocacao = tempo;
        }
    }

    if (botaoDireitoPressionado && !movelCarregado) tentarEmpurrarItem();

    for (let i = itens.length - 1; i >= 0; i--) {
        const it = itens[i];
        it.bob += dt * 3;
        const d = Math.sqrt((it.x-jogador.x)**2 + (it.y-jogador.y)**2);
        if (d < jogador.raio + it.raio + 8) {
            adicionarItem(it.tipo);
            itens.splice(i, 1);
        }
    }

    if (spawnTimer > Math.max(1.5, 5 - tempo/30) && zumbis.length < 30) {
        spawnTimer = 0;
        let sx, sy;
        const lado = Math.floor(Math.random() * 4);
        if (lado === 0) { sx = 60; sy = Math.random() * ALTURA_MUNDO; }
        else if (lado === 1) { sx = LARGURA_MUNDO - 60; sy = Math.random() * ALTURA_MUNDO; }
        else if (lado === 2) { sx = Math.random() * LARGURA_MUNDO; sy = ALTURA_MUNDO - 60; }
        else { sx = Math.random() * LARGURA_MUNDO; sy = 60; }
        const rapido = Math.random() < 0.6;
        if (!colide(sx, sy, 15)) {
            zumbis.push(rapido ? criarZumbiRapido(sx, sy) : criarZumbiForte(sx, sy));
        }
    }

    // IA
    for (let zi = 0; zi < zumbis.length; zi++) {
        const z = zumbis[zi];
        const dxp = jogador.x - z.x, dyp = jogador.y - z.y;
        const dist = Math.sqrt(dxp*dxp + dyp*dyp);

        const alcance = z.tipo === 'rapido' ? 320 : 240;
        const veJogador = dist < alcance && temVisao(z.x, z.y, jogador.x, jogador.y);

        if (veJogador) {
            z.ultimoVisto = { x: jogador.x, y: jogador.y };
            z.tempoPerdido = 0;
        } else {
            z.tempoPerdido += dt;
            if (z.tempoPerdido > z.memoria) z.ultimoVisto = null;
        }

        let alvoX, alvoY, barricadaAlvo = null;
        if (veJogador || (z.ultimoVisto && z.tempoPerdido < z.memoria)) {
            alvoX = z.ultimoVisto ? z.ultimoVisto.x : jogador.x;
            alvoY = z.ultimoVisto ? z.ultimoVisto.y : jogador.y;
            let menorDistBar = 120;
            for (let bi = 0; bi < barricadas.length; bi++) {
                const b = barricadas[bi];
                if (b.vida <= 0) continue;
                const d = Math.sqrt((b.x-z.x)**2 + (b.y-z.y)**2);
                if (d > menorDistBar) continue;
                const dot = ((b.x-z.x)*dxp + (b.y-z.y)*dyp) / (d * dist || 1);
                if (dot > 0.5) { menorDistBar = d; barricadaAlvo = b; }
            }
            if (barricadaAlvo) { alvoX = barricadaAlvo.x; alvoY = barricadaAlvo.y; }
        } else {
            if (!z.vagarPonto || Math.sqrt((z.vagarPonto.x-z.x)**2 + (z.vagarPonto.y-z.y)**2) < 20) {
                z.vagarPonto = {
                    x: Math.max(80, Math.min(LARGURA_MUNDO - 80, z.x + (Math.random() - 0.5) * 500)),
                    y: Math.max(80, Math.min(ALTURA_MUNDO - 80, z.y + (Math.random() - 0.5) * 500))
                };
            }
            alvoX = z.vagarPonto.x;
            alvoY = z.vagarPonto.y;
        }

        const aDx = alvoX - z.x, aDy = alvoY - z.y;
        const aDist = Math.sqrt(aDx*aDx + aDy*aDy);
        if (aDist > 5) {
            const nx = z.x + (aDx/aDist) * z.vel * dt;
            const ny = z.y + (aDy/aDist) * z.vel * dt;
            if (!colide(nx, z.y, z.raio)) { z.x = nx; z.passo += dt * 8; }
            if (!colide(z.x, ny, z.raio)) { z.y = ny; z.passo += dt * 8; }
        }

        if (barricadaAlvo) {
            const db = Math.sqrt((barricadaAlvo.x-z.x)**2 + (barricadaAlvo.y-z.y)**2);
            if (db < z.raio + barricadaAlvo.raio + 5) {
                if (tempo - (z.ultimoAtaqueBar || 0) > 0.7) {
                    z.ultimoAtaqueBar = tempo;
                    barricadaAlvo.vida -= z.tipo === 'forte' ? 12 : 5;
                    tocarArrombando();
                    if (barricadaAlvo.vida <= 0) {
                        tocarBarricadaQuebrada();
                        itens.push(criarItem(barricadaAlvo.x, barricadaAlvo.y, barricadaAlvo.tipo));
                    }
                }
            }
        }

        if (dist < z.raio + jogador.raio + 4 && tempo - z.ultimoDano > 0.8) {
            jogador.vida -= z.dano;
            z.ultimoDano = tempo;
            tocarDano();
            atualizarHUD();
            if (jogador.vida <= 0) gameOver();
        }
    }

    for (let i = barricadas.length - 1; i >= 0; i--)
        if (barricadas[i].vida <= 0) barricadas.splice(i, 1);
    for (let i = zumbis.length - 1; i >= 0; i--)
        if (zumbis[i].vida <= 0) { zumbis.splice(i, 1); atualizarHUD(); }
    for (let i = particulas.length - 1; i >= 0; i--) {
        const p = particulas[i];
        p.vida -= dt;
        if (p.tipo === 'sangue') { p.x += p.vx * dt; p.y += p.vy * dt; }
        if (p.vida <= 0) particulas.splice(i, 1);
    }
    atualizarHUD();
}

// ===== RENDER =====
function desenharTile(px, py, tipo) {
    switch (tipo) {
        case 0:
            ctx.fillStyle = '#4a3828';
            ctx.fillRect(px, py, TAMANHO_TILE, TAMANHO_TILE);
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.moveTo(px + 20, py); ctx.lineTo(px + 20, py + TAMANHO_TILE);
            ctx.stroke();
            break;
        case 1:
            ctx.fillStyle = '#5a4a3a';
            ctx.fillRect(px, py, TAMANHO_TILE, TAMANHO_TILE);
            ctx.strokeStyle = '#3a2a1a';
            ctx.lineWidth = 2;
            ctx.strokeRect(px + 1, py + 1, TAMANHO_TILE - 2, TAMANHO_TILE - 2);
            break;
        case 2:
            ctx.fillStyle = '#2a2a2e';
            ctx.fillRect(px, py, TAMANHO_TILE, TAMANHO_TILE);
            break;
        case 3:
            ctx.fillStyle = '#2e4a25';
            ctx.fillRect(px, py, TAMANHO_TILE, TAMANHO_TILE);
            break;
        case 4:
            ctx.fillStyle = '#5a5a5a';
            ctx.fillRect(px, py, TAMANHO_TILE, TAMANHO_TILE);
            ctx.strokeStyle = '#4a4a4a';
            ctx.strokeRect(px + 1, py + 1, TAMANHO_TILE - 2, TAMANHO_TILE - 2);
            break;
        case 5:
            ctx.fillStyle = '#5a3040';
            ctx.fillRect(px, py, TAMANHO_TILE, TAMANHO_TILE);
            break;
        case 6:
            ctx.fillStyle = '#7a9aa5';
            ctx.fillRect(px, py, TAMANHO_TILE, TAMANHO_TILE);
            ctx.strokeStyle = '#5a7a85';
            ctx.strokeRect(px, py, TAMANHO_TILE, TAMANHO_TILE);
            break;
    }
}

function desenharJogador() {
    const x = jogador.x, y = jogador.y, direcao = jogador.direcao;
    const andando = (teclas['w'] || teclas['a'] || teclas['s'] || teclas['d'] ||
                     teclas['arrowup'] || teclas['arrowdown'] || teclas['arrowleft'] || teclas['arrowright']);
    const balanco = andando ? Math.sin(jogador.passo) * 3 : 0;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(x, y + 12, 14, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#2a3a6f';
    ctx.fillRect(-7, 12, 5, 5 + balanco);
    ctx.fillRect(2, 12, 5, 5 - balanco);

    ctx.fillStyle = '#3a5abf';
    ctx.beginPath();
    ctx.roundRect(-9, -4, 18, 16, 3);
    ctx.fill();
    ctx.strokeStyle = '#1a3a8f';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#5a7adf';
    ctx.beginPath();
    ctx.arc(-11, 2 + balanco, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(11, 2 - balanco, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e8b48a';
    ctx.beginPath();
    ctx.arc(0, -8, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#a07a5a';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#3a2818';
    ctx.beginPath();
    ctx.arc(0, -10, 8, Math.PI, 0);
    ctx.fill();

    const eyeOffX = Math.cos(direcao) * 2;
    const eyeOffY = Math.sin(direcao) * 1;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-3 + eyeOffX, -8 + eyeOffY, 1.5, 0, Math.PI*2);
    ctx.arc(3 + eyeOffX, -8 + eyeOffY, 1.5, 0, Math.PI*2);
    ctx.fill();

    if (inventario.indexOf('arma') >= 0) {
        ctx.save();
        ctx.rotate(direcao);
        ctx.fillStyle = '#222';
        ctx.fillRect(8, -3, 14, 5);
        ctx.fillStyle = '#444';
        ctx.fillRect(8, -3, 8, 5);
        ctx.restore();
    }

    if (movelCarregado) {
        const info = TIPOS_ITEM[movelCarregado];
        ctx.fillStyle = info.cor;
        ctx.beginPath();
        ctx.roundRect(-12, -30, 24, 16, 4);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    ctx.restore();
}

function desenharZumbi(z) {
    const x = z.x, y = z.y, raio = z.raio, tipo = z.tipo, cor = z.cor, corBorda = z.corBorda;
    const balanco = Math.sin(z.passo) * 2;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(x, y + raio * 0.9, raio * 1.1, raio * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    const escala = tipo === 'rapido' ? 0.75 : 1.2;

    ctx.fillStyle = corBorda;
    ctx.fillRect(-6 * escala, 10 * escala, 4 * escala, 6 * escala);
    ctx.fillRect(2 * escala, 10 * escala, 4 * escala, 6 * escala);

    ctx.fillStyle = corBorda;
    ctx.beginPath();
    ctx.roundRect(-9 * escala, -2 * escala, 18 * escala, 14 * escala, 4);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = cor;
    ctx.beginPath();
    ctx.ellipse(-11 * escala, -1 * escala + balanco, 4 * escala, 6 * escala, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = corBorda;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(11 * escala, -1 * escala - balanco, 4 * escala, 6 * escala, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = cor;
    ctx.beginPath();
    ctx.arc(0, -9 * escala, 8 * escala, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = corBorda;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#f00';
    ctx.shadowColor = '#f00';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(-3 * escala, -9 * escala, 1.8 * escala, 0, Math.PI * 2);
    ctx.arc(3 * escala, -9 * escala, 1.8 * escala, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();

    const maxVida = tipo === 'rapido' ? 20 : 70;
    if (z.vida < maxVida) {
        const pct = z.vida / maxVida;
        const w = raio * 2;
        ctx.fillStyle = '#000';
        ctx.fillRect(x - raio - 1, y - raio - 14, w + 2, 5);
        ctx.fillStyle = pct > 0.5 ? '#0f0' : pct > 0.25 ? '#ff0' : '#f00';
        ctx.fillRect(x - raio, y - raio - 13, w * pct, 3);
    }
}

function desenharItem(it) {
    const info = TIPOS_ITEM[it.tipo];
    const bob = Math.sin(it.bob) * 3;

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(it.x, it.y + 12, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = info.cor;
    ctx.beginPath();
    ctx.roundRect(it.x - 14, it.y - 14 + bob, 28, 28, 6);
    ctx.fill();
    ctx.strokeStyle = info.cor2;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.font = '20px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(info.emoji, it.x, it.y + 1 + bob);
}

function desenharBarricada(b) {
    const info = TIPOS_ITEM[b.tipo];

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.ellipse(b.x, b.y + b.raio * 0.7, b.raio * 1.2, b.raio * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = info.cor;
    ctx.beginPath();
    ctx.roundRect(b.x - b.raio, b.y - b.raio, b.raio * 2, b.raio * 2, 8);
    ctx.fill();
    ctx.strokeStyle = info.cor2;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.font = (b.raio + 4) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(info.emoji, b.x, b.y);

    const pct = b.vida / b.vidaMax;
    const barW = b.raio * 2;
    ctx.fillStyle = '#000';
    ctx.fillRect(b.x - b.raio - 2, b.y - b.raio - 16, barW + 4, 8);
    ctx.fillStyle = pct > 0.5 ? '#0f0' : pct > 0.25 ? '#ff0' : '#f00';
    ctx.fillRect(b.x - b.raio, b.y - b.raio - 14, barW * pct, 4);
}

function render() {
    ctx.fillStyle = '#0a0a0c';
    ctx.fillRect(0, 0, LARGURA, ALTURA);

    const targetX = Math.max(0, Math.min(LARGURA_MUNDO - LARGURA, jogador.x - LARGURA/2));
    const targetY = Math.max(0, Math.min(ALTURA_MUNDO - ALTURA, jogador.y - ALTURA/2));
    camera.x += (targetX - camera.x) * 0.15;
    camera.y += (targetY - camera.y) * 0.15;

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    const x0 = Math.max(0, Math.floor(camera.x / TAMANHO_TILE) - 1);
    const y0 = Math.max(0, Math.floor(camera.y / TAMANHO_TILE) - 1);
    const x1 = Math.min(MAPA_LARGURA, Math.ceil((camera.x + LARGURA) / TAMANHO_TILE) + 1);
    const y1 = Math.min(MAPA_ALTURA, Math.ceil((camera.y + ALTURA) / TAMANHO_TILE) + 1);

    for (let y = y0; y < y1; y++)
        for (let x = x0; x < x1; x++)
            desenharTile(x * TAMANHO_TILE, y * TAMANHO_TILE, MAPA[y][x]);

    for (let i = 0; i < manchasSangue.length; i++) {
        const s = manchasSangue[i];
        ctx.fillStyle = s.cor;
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.raio, s.raio * s.escalaY, s.rot, 0, Math.PI * 2);
        ctx.fill();
    }

    for (let i = 0; i < itens.length; i++) desenharItem(itens[i]);
    for (let i = 0; i < barricadas.length; i++) desenharBarricada(barricadas[i]);
    for (let i = 0; i < zumbis.length; i++) desenharZumbi(zumbis[i]);

    desenharJogador();

    if (movelCarregado) {
        const info = TIPOS_ITEM[movelCarregado];
        const pvx = jogador.x + Math.cos(jogador.direcao) * (jogador.raio + info.tamanho + 4);
        const pvy = jogador.y + Math.sin(jogador.direcao) * (jogador.raio + info.tamanho + 4);
        const pode = !colide(pvx, pvy, info.tamanho);

        ctx.strokeStyle = pode ? 'rgba(0,255,0,0.8)' : 'rgba(255,0,0,0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(pvx, pvy, info.tamanho, 0, Math.PI*2);
        ctx.stroke();
    }

    for (let i = 0; i < particulas.length; i++) {
        const p = particulas[i];
        if (p.tipo === 'tiro') {
            ctx.strokeStyle = 'rgba(255, 230, 100, ' + (p.vida * 12) + ')';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(p.x1, p.y1);
            ctx.lineTo(p.x2, p.y2);
            ctx.stroke();
        } else if (p.tipo === 'sangue') {
            ctx.fillStyle = 'rgba(200, 30, 30, ' + (p.vida * 1.5) + ')';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    const mmX = mouse.x + camera.x;
    const mmY = mouse.y + camera.y;
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(jogador.x, jogador.y);
    ctx.lineTo(mmX, mmY);
    ctx.stroke();

    ctx.restore();

    // Cursor
    ctx.strokeStyle = 'rgba(255,80,80,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);
    ctx.moveTo(mouse.x - 16, mouse.y);
    ctx.lineTo(mouse.x - 6, mouse.y);
    ctx.moveTo(mouse.x + 6, mouse.y);
    ctx.lineTo(mouse.x + 16, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 16);
    ctx.lineTo(mouse.x, mouse.y - 6);
    ctx.moveTo(mouse.x, mouse.y + 6);
    ctx.lineTo(mouse.x, mouse.y + 16);
    ctx.stroke();

    if (movelCarregado) {
        ctx.fillStyle = 'rgba(255, 200, 0, 0.9)';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🚧 E para colocar a barricada | Q para devolver', LARGURA/2, ALTURA - 15);
    }
}

function gameOver() {
    rodando = false;
    document.getElementById('tempoFinal').textContent = Math.floor(tempo);
    document.getElementById('zumbisMortos').textContent = zumbisMortosContador;
    document.getElementById('gameOver').classList.remove('escondido');
}

function loop(timestamp) {
    if (!ultimoFrame) ultimoFrame = timestamp;
    const dt = Math.min(0.05, (timestamp - ultimoFrame) / 1000);
    ultimoFrame = timestamp;
    if (rodando) atualizar(dt);
    render();
    requestAnimationFrame(loop);
}

iniciar();
